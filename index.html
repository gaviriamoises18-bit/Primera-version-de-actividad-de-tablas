<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica de tablas</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <main>
        <h1>Practica de tablas en HTML</h1>
        <!--Aqui va un <section> por cada tabla de los pasos 1 a 9-->
            <section>
                <table>
                    <tr>
                        <td>Moises</td>
                        <td>4.0</td>
                    </tr>
                    <tr>
                        <td>Mateo</td>
                        <td>4.8</td>
                    </tr>
                </table>
            </section>
            <section>
                <table>
                    <tr>
                        <th>Aprendiz</th>
                        <th>Nota</th>
                    </tr>
                    <tr>
                        <td>Moises</td>
                        <td>4.0</td>
                    </tr>
                </table>
            </section>
            <section>
                <table> 
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody>
                       <tr><td>Teclado</td><td>$85.000</td></tr>
                       <tr><td>Mouse</td><td>$40.000</td></tr>
                    </tbody>
                    <tfoot>
                        <tr><td>Total</td><td>$125.000</td></tr>
                    </tfoot>
                </table>
            </section>
            <section>
                <table>
                    <caption>Notas del primer trimestre</caption>
                    <thead>
                        <tr><th>Aprendiz</th><th>Nota</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Moises</td><td>4.0</td></tr>
                    </tbody>
                </table>
            </section>
            <section>
                <table>
                    <tr>
                        <th colspan="2">Datos personales</th>
                        <th>Ficha</th>
                    </tr>
                    <tr>
                        <td>Moises</td>
                        <td>Gaviria</td>
                        <td>1029993</td>
                    </tr>
                </table>
            </section>
           <section>
            <table>
                <tr>
                    <th rowspan="2">Lunes</th>
                    <td>6:00 a.m.</td>
                    <td>HTML</td>
                </tr>
                <tr>
                    <!-- Aqui no va "Lunes": ya ocupa esta fila-->
                     <td>8:00 a.m.</td>
                     <td>CSS</td>
                </tr>
            </table>
           </section> 
           <section>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Aprendiz</th>
                        <th scope="col">Nota</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Moises</th>
                        <td>4.0</td>
                    </tr>
                </tbody>
            </table>
           </section>
           <section>
            <div class="tabla-contenedor">
                <table>...</table>
           </section>
    </main>
</body>
</html>
